name: GUI screenshots (real Windows windows, fake model)
on:
  workflow_dispatch:
jobs:
  shots:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Dashboard (empty)
        shell: pwsh
        run: python tools/screenshot_gui.py empty 4
      - name: Dashboard with a plan
        shell: pwsh
        run: python tools/screenshot_gui.py dashboard 6
