name: GUI screenshots (real Windows windows, fake model)
on:
  workflow_dispatch:
jobs:
  shots:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Main window
        shell: pwsh
        run: python tools/screenshot_gui.py main 4
      - name: Request window with plan
        shell: pwsh
        run: python tools/screenshot_gui.py plan 4
      - name: Request window after approval
        shell: pwsh
        run: python tools/screenshot_gui.py approved 5
