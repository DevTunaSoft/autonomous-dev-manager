name: Windows desktop build and packaged smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'adm/**'
      - 'tests/**'
      - 'tools/**'
      - 'BUILD-WINDOWS-DESKTOP.cmd'
      - 'VERIFY-WINDOWS-DESKTOP.ps1'
      - '.github/workflows/windows-desktop-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'adm/**'
      - 'tests/**'
      - 'tools/**'
      - 'BUILD-WINDOWS-DESKTOP.cmd'
      - 'VERIFY-WINDOWS-DESKTOP.ps1'
      - '.github/workflows/windows-desktop-build.yml'
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned packaging tool
        run: python -m pip install --disable-pip-version-check pyinstaller==6.11.1 pywin32
      - name: Verify sources compile
        run: python -m compileall -q adm tests
      - name: Windows startup and packaged-entry tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_windows_startup.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_desktop_entry_exit.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare and verify bundled Python runtime
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile embed.zip
          Expand-Archive embed.zip -DestinationPath pyembed -Force
          python -c "import sys; sys.path.insert(0,'.'); from adm.runtime_install import fixup_pth; print('pth:', fixup_pth('pyembed'))"
          python tools/verify_bundled_python.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and run packaged smoke test
        shell: cmd
        run: BUILD-WINDOWS-DESKTOP.cmd
      - name: Packaged EXE end-to-end repair against FAKE Ollama
        shell: pwsh
        run: ./tools/verify-packaged-repair.ps1
      - name: First-run local-AI prompt (real Windows window, prompt captured)
        shell: pwsh
        run: |
          python -c "import json; from adm import firstrun; a=firstrun.assess(); print(json.dumps(a, indent=1)); print('----- TEXT THE USER SEES -----'); print(firstrun.prompt_text(a)[1])"
          python -c "from adm import desktop; desktop.main(auto_close_ms=6000, ask=lambda t, m: (print('GUI PROMPT SHOWN:', t), print(m), False)[2])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Request window (real Windows window, FAKE model, plan approved)
        shell: pwsh
        run: |
          python tools/verify_request_window.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package a generated project into an EXE and run it
        shell: pwsh
        run: |
          python tools/verify_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Print build evidence to the log
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem build-evidence -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Raw }
          if (Test-Path build\ADM-Desktop\warn-ADM-Desktop.txt) { '--- PyInstaller warnings'; Get-Content build\ADM-Desktop\warn-ADM-Desktop.txt -TotalCount 80 }
      - name: Upload build verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ADM-Windows-build-evidence
          path: |
            build-evidence/
            packaged-repair-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows EXE for acceptance testing
        uses: actions/upload-artifact@v4
        with:
          name: ADM-Desktop-Windows-unverified
          path: dist/ADM-Desktop.exe
          if-no-files-found: error
          retention-days: 7

  windows-full-regression:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full regression on Windows
        shell: pwsh
        run: |
          python -B -m adm.regression --root . --timeout 300 --output win-regression/regression.json
          $code = $LASTEXITCODE
          python -c "import sys,json; sys.stdout.reconfigure(encoding='utf-8',errors='replace'); r=json.load(open('win-regression/regression.json')); [print('=== %s %s (%s tests)\n%s' % (m['module'],m['status'],m['tests'],m['output_tail'][-2500:])) for m in r['modules'] if m['status']!='passed']"
          exit $code
      - name: Adversarial fuzz harnesses
        shell: pwsh
        run: |
          python -I tools/fuzz_adversarial.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial3.py
