          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial8.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial9.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial10.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial11.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial12.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial13.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial14.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial15.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial16.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial17.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial18.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial19.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial20.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/fuzz_adversarial21.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
