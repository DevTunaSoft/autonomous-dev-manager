name: Sandbox feasibility probes (throwaway runner)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pywin32
      - name: Prepare bundled Python runtime
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile embed.zip
          Expand-Archive embed.zip -DestinationPath pyembed -Force
          python -c "import sys; sys.path.insert(0,'.'); from adm.runtime_install import fixup_pth; print('pth:', fixup_pth('pyembed'))"
      - name: Run feasibility probes
        shell: pwsh
        run: python tools/sandbox_probe.py | Tee-Object -FilePath probe-results.jsonl
      - name: Run live check of adm.sandbox
        shell: pwsh
        run: python tools/sandbox_live_check.py | Tee-Object -FilePath live-check-results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ADM-sandbox-probe-results
          path: |
            probe-results.jsonl
            live-check-results.jsonl
