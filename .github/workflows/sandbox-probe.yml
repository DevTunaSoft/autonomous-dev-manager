name: Sandbox feasibility probes (throwaway runner)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run probes
        shell: pwsh
        run: python tools/sandbox_probe.py | Tee-Object -FilePath probe-results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ADM-sandbox-probe-results
          path: probe-results.jsonl
